<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Phone fix: without this, phones show the page zoomed out as if it were a wide desktop. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Lost &amp; Found</title>
    <link rel="stylesheet" href="style.css">
    <!-- FIX 1: script was in <head> and ran before the page loaded, so #message was null. Added defer. Found it from the console error. -->
    <script src="app.js" defer></script>

<body>
    <header>
        <h1>Campus Lost &amp; Found</h1>
        <p>Found something? It might be here.</p>
    </header>

    <main>
        <section class="controls">
            <input id="search" type="text" placeholder="Search items..." aria-label="Search items by name">
            <p id="message" aria-live="polite"></p>
            <p id="count" aria-live="polite"></p>
            <select id="category">
                <option value="all">All categories</option>
            </select>
            <label class="hide-claimed">
                <input id="hideClaimed" type="checkbox">
                Hide claimed items
            </label>
        </section>

        <p id="message"></p>
        <p id="count"></p>
        <div id="board"></div>
    </main>
</body>

</html>
